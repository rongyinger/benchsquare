<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1230"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#99804a"/></marker></defs><rect width="1440" height="1230" fill="#fafaf6"/><g font-family="Microsoft YaHei,SimHei,sans-serif"><text x="45" y="45" font-size="17" fill="#8b7c45" font-weight="600">BENCHSQUARE / CURRENT DEMO / 2026-10-27</text><text x="45" y="100" font-size="36" fill="#30382d" font-weight="700">模拟审核阶段与四类看板状态</text><text x="45" y="142" font-size="21" fill="#747d6d" font-weight="400">实线表示当前模拟审核操作；未包含真实终检作业、服务器入库与正式通知。</text><rect x="55" y="200" width="300" height="115" rx="14" fill="#fff" stroke="#d8dccf"/><text x="77" y="238" font-size="25" fill="#30382d" font-weight="600">草稿</text><text x="77" y="272" font-size="19" fill="#707967" font-weight="400">可保存不完整内容</text><rect x="535" y="200" width="340" height="115" rx="14" fill="#fff" stroke="#d8dccf"/><text x="557" y="238" font-size="25" fill="#30382d" font-weight="600">待初审</text><text x="557" y="272" font-size="19" fill="#707967" font-weight="400">本地正式版本已保存</text><rect x="1055" y="200" width="330" height="115" rx="14" fill="#fff4c7" stroke="#d8dccf"/><text x="1077" y="238" font-size="25" fill="#30382d" font-weight="600">终检中</text><text x="1077" y="272" font-size="19" fill="#707967" font-weight="400">模拟初审通过后进入</text><path d="M355 257H535" fill="none" stroke="#99804a" stroke-width="3" marker-end="url(#a)"/><text x="390" y="240" font-size="18" fill="#81682e" font-weight="400">提交／重提</text><path d="M875 257H1055" fill="none" stroke="#99804a" stroke-width="3" marker-end="url(#a)"/><text x="900" y="240" font-size="18" fill="#81682e" font-weight="400">初审通过</text><rect x="55" y="460" width="330" height="115" rx="14" fill="#fff1df" stroke="#d8dccf"/><text x="77" y="498" font-size="25" fill="#30382d" font-weight="600">需修改</text><text x="77" y="532" font-size="19" fill="#707967" font-weight="400">保留对应版本问题</text><rect x="535" y="460" width="340" height="115" rx="14" fill="#fff" stroke="#d8dccf"/><text x="557" y="498" font-size="25" fill="#30382d" font-weight="600">未通过</text><text x="557" y="532" font-size="19" fill="#707967" font-weight="400">初审可直接不采用</text><rect x="1055" y="460" width="330" height="115" rx="14" fill="#eaf2e3" stroke="#d8dccf"/><text x="1077" y="498" font-size="25" fill="#30382d" font-weight="600">已通过</text><text x="1077" y="532" font-size="19" fill="#707967" font-weight="400">看板显示“已录用”</text><path d="M600 315V390H220V460" fill="none" stroke="#99804a" stroke-width="3" marker-end="url(#a)"/><text x="235" y="377" font-size="18" fill="#81682e" font-weight="400">初审要求修改</text><path d="M705 315V460" fill="none" stroke="#99804a" stroke-width="3" marker-end="url(#a)"/><text x="720" y="410" font-size="18" fill="#81682e" font-weight="400">初审不采用</text><path d="M1135 315V420H805V460" fill="none" stroke="#99804a" stroke-width="3" marker-end="url(#a)"/><text x="850" y="407" font-size="18" fill="#81682e" font-weight="400">终检不通过</text><path d="M1270 315V460" fill="none" stroke="#99804a" stroke-width="3" marker-end="url(#a)"/><text x="1285" y="395" font-size="18" fill="#81682e" font-weight="400">终检通过</text><path d="M1055 280H985V435H385V490" fill="none" stroke="#99804a" stroke-width="3" marker-end="url(#a)"/><text x="530" y="425" font-size="18" fill="#81682e" font-weight="400">终检需修改</text><path d="M55 520H25V160H705V200" fill="none" stroke="#99804a" stroke-width="3" marker-end="url(#a)"/><text x="60" y="180" font-size="18" fill="#81682e" font-weight="400">原Task重提 → 新版本待初审</text><text x="55" y="650" font-size="28" fill="#30382d" font-weight="600">看板展示分组（不同于全部处理阶段）</text><rect x="55" y="685" width="310" height="145" rx="14" fill="#fff" stroke="#d8dccf"/><text x="77" y="723" font-size="25" fill="#30382d" font-weight="600">草稿</text><text x="77" y="757" font-size="19" fill="#707967" font-weight="400">未关联、原草稿</text><text x="77" y="786" font-size="19" fill="#707967" font-weight="400">或存在修改工作副本</text><rect x="395" y="685" width="310" height="145" rx="14" fill="#fff" stroke="#d8dccf"/><text x="417" y="723" font-size="25" fill="#30382d" font-weight="600">待审核</text><text x="417" y="757" font-size="19" fill="#707967" font-weight="400">待初审、终检中</text><text x="417" y="786" font-size="19" fill="#707967" font-weight="400">等待本轮审核结果</text><rect x="735" y="685" width="310" height="145" rx="14" fill="#fff" stroke="#d8dccf"/><text x="757" y="723" font-size="25" fill="#30382d" font-weight="600">已审核</text><text x="757" y="757" font-size="19" fill="#707967" font-weight="400">已审核、需修改、未通过</text><text x="757" y="786" font-size="19" fill="#707967" font-weight="400">反馈区进一步区分结果</text><rect x="1075" y="685" width="310" height="145" rx="14" fill="#fff" stroke="#d8dccf"/><text x="1097" y="723" font-size="25" fill="#30382d" font-weight="600">已录用</text><text x="1097" y="757" font-size="19" fill="#707967" font-weight="400">已通过／已录用</text><text x="1097" y="786" font-size="19" fill="#707967" font-weight="400">无优先展示的修改草稿</text><rect x="55" y="875" width="1330" height="110" rx="14" fill="#fff1df" stroke="#d8dccf"/><text x="77" y="913" font-size="25" fill="#30382d" font-weight="600">当前修改行为</text><text x="77" y="947" font-size="19" fill="#707967" font-weight="400">各状态均能打开修改副本；保存后看板归草稿，原正式记录及历史保留。</text><text x="77" y="976" font-size="19" fill="#707967" font-weight="400">该入口尚未实现终态只读；不能把现状图当作生产审核权限证明。</text><rect x="55" y="1020" width="1330" height="130" rx="14" fill="#f1f4eb" stroke="#d8dccf"/><text x="77" y="1058" font-size="25" fill="#30382d" font-weight="600">赛程边界与当前限制</text><text x="77" y="1092" font-size="19" fill="#707967" font-weight="400">报名开始 → 报名结束 → 任务提交开始 → 新增提交截止 → 补正截止 → 结果公示</text><text x="77" y="1121" font-size="19" fill="#707967" font-weight="400">各节点分别展示，未配置显示待确定；草稿可跨提交期保存。</text><text x="77" y="1150" font-size="19" fill="#707967" font-weight="400">当前新增截止后正式提交被阻拦，合法原任务补正放行尚未接通。</text><text x="45" y="1202" font-size="18" fill="#858c7b" font-weight="400">当前Demo现状图 · 本地演示不代表真实上传、正式审核或官方录用</text></g></svg>