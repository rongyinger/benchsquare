<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1230"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#99804a"/></marker></defs><rect width="1440" height="1230" fill="#fafaf6"/><g font-family="Microsoft YaHei,SimHei,sans-serif"><text x="45" y="45" font-size="17" fill="#8b7c45" font-weight="600">BENCHSQUARE / CURRENT DEMO / 2026-10-29</text><text x="45" y="100" font-size="36" fill="#30382d" font-weight="700">个人数据准备与比赛提交：当前实际路径</text><text x="45" y="142" font-size="21" fill="#747d6d" font-weight="400">两种入口共用编辑器；比赛入口先选草稿，保存与正式提交分别校验。</text><rect x="55" y="195" width="580" height="125" rx="14" fill="#fff4c7" stroke="#d8dccf"/><text x="77" y="233" font-size="25" fill="#30382d" font-weight="600">入口A：个人数据看板</text><text x="77" y="267" font-size="19" fill="#707967" font-weight="400">按比赛／状态查看本人记录</text><text x="77" y="296" font-size="19" fill="#707967" font-weight="400">新建通用草稿，或继续编辑本人记录</text><rect x="805" y="195" width="580" height="125" rx="14" fill="#fff4c7" stroke="#d8dccf"/><text x="827" y="233" font-size="25" fill="#30382d" font-weight="600">入口B：比赛详情 → 提交数据</text><text x="827" y="267" font-size="19" fill="#707967" font-weight="400">有效参赛者进入比赛提交场景</text><text x="827" y="296" font-size="19" fill="#707967" font-weight="400">我的比赛卡片：查看团队与赛事</text><rect x="805" y="380" width="580" height="130" rx="14" fill="#fff" stroke="#d8dccf"/><text x="827" y="418" font-size="25" fill="#30382d" font-weight="600">从草稿中选择</text><text x="827" y="452" font-size="19" fill="#707967" font-weight="400">本人本比赛草稿 ＋ 未关联草稿</text><text x="827" y="481" font-size="19" fill="#707967" font-weight="400">也可选择“新建数据任务”</text><rect x="325" y="580" width="790" height="160" rx="14" fill="#fff" stroke="#d8dccf"/><text x="347" y="618" font-size="25" fill="#30382d" font-weight="600">共用编辑抽屉：四分区12项业务字段</text><text x="347" y="652" font-size="19" fill="#707967" font-weight="400">任务信息 → 材料与参考结果 → 验证标准 → 提交确认</text><text x="347" y="681" font-size="19" fill="#707967" font-weight="400">公开输入与私有参考分区预览；双确认后允许提交校验</text><text x="347" y="710" font-size="19" fill="#707967" font-weight="400">不再采集自测模型、框架、预估得分或自测证据</text><path d="M345 320V540H600V580" fill="none" stroke="#99804a" stroke-width="3" marker-end="url(#a)"/><path d="M1095 320V380" fill="none" stroke="#99804a" stroke-width="3" marker-end="url(#a)"/><path d="M1095 510V550H900V580" fill="none" stroke="#99804a" stroke-width="3" marker-end="url(#a)"/><rect x="55" y="820" width="580" height="150" rx="14" fill="#fff" stroke="#d8dccf"/><text x="77" y="858" font-size="25" fill="#30382d" font-weight="600">保存草稿／修改工作副本</text><text x="77" y="892" font-size="19" fill="#707967" font-weight="400">缺项、未勾确认仍可保存</text><text x="77" y="921" font-size="19" fill="#707967" font-weight="400">不要求已组队或处于提交期</text><text x="77" y="950" font-size="19" fill="#707967" font-weight="400">文字记录＋实际文件保存至当前浏览器</text><rect x="805" y="820" width="580" height="150" rx="14" fill="#fff" stroke="#d8dccf"/><text x="827" y="858" font-size="25" fill="#30382d" font-weight="600">模拟提交／原Task重提</text><text x="827" y="892" font-size="19" fill="#707967" font-weight="400">检查字段、身份、报名、团队与提交时间</text><text x="827" y="921" font-size="19" fill="#707967" font-weight="400">本地生成编号、版本与快照 → 待初审</text><text x="827" y="950" font-size="19" fill="#707967" font-weight="400">新版本保留原Task ID和此前记录</text><path d="M540 740V780H345V820" fill="none" stroke="#99804a" stroke-width="3" marker-end="url(#a)"/><text x="370" y="796" font-size="18" fill="#81682e" font-weight="400">保存</text><path d="M900 740V780H1095V820" fill="none" stroke="#99804a" stroke-width="3" marker-end="url(#a)"/><text x="1110" y="795" font-size="18" fill="#81682e" font-weight="400">提交</text><rect x="55" y="1030" width="1330" height="120" rx="14" fill="#f1f4eb" stroke="#d8dccf"/><text x="77" y="1068" font-size="25" fill="#30382d" font-weight="600">回到本人记录：看板、详情、反馈与历史</text><text x="77" y="1102" font-size="19" fill="#707967" font-weight="400">当前看板按四类分组；修改草稿优先显示为草稿，原正式记录仍保留。</text><text x="77" y="1131" font-size="19" fill="#707967" font-weight="400">附件当前实际单文件上限1GB；正式50GB为目标规格。未接入远程上传与Task通知。</text><path d="M345 970V1030" fill="none" stroke="#99804a" stroke-width="3" marker-end="url(#a)"/><path d="M1095 970V1030" fill="none" stroke="#99804a" stroke-width="3" marker-end="url(#a)"/><text x="45" y="1202" font-size="18" fill="#858c7b" font-weight="400">当前Demo现状图 · 本地演示不代表真实上传、正式审核或官方录用</text></g></svg>