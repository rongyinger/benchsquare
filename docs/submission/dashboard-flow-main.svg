<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="930" viewBox="0 0 1100 930"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9ba4b4"/></marker></defs><rect width="100%" height="100%" fill="#f8faff"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="550" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#243044">BenchSquare · 个人数据看板主流程</text><text x="550" y="68" text-anchor="middle" font-size="12" fill="#7b8596">当前状态显示结果，点击状态按钮查看消息 · 2026-11-04</text><rect x="365" y="110" width="370" height="76" rx="10" fill="#fff" stroke="#dbe1ec"/><text x="550" y="140" text-anchor="middle" font-size="16" fill="#29364b">进入个人数据看板</text><text x="550" y="163" text-anchor="middle" font-size="12" fill="#7c8699">仅本人记录 · 按比赛分组</text><path d="M550 186V218" fill="none" stroke="#9ba4b4" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="365" y="220" width="370" height="76" rx="10" fill="#fff" stroke="#dbe1ec"/><text x="550" y="250" text-anchor="middle" font-size="16" fill="#29364b">统计、搜索、筛选与查看状态</text><text x="550" y="273" text-anchor="middle" font-size="12" fill="#7c8699">已审核 · 需补正 / 审核通过 / 审核不通过</text><path d="M550 296V328" fill="none" stroke="#9ba4b4" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="365" y="330" width="370" height="76" rx="10" fill="#fffbed" stroke="#e4bd28"/><text x="550" y="360" text-anchor="middle" font-size="16" fill="#29364b">点击「已审核 · 具体结果」</text><text x="550" y="383" text-anchor="middle" font-size="12" fill="#7c8699">当前状态列的可点击按钮</text><path d="M550 406V438" fill="none" stroke="#9ba4b4" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="365" y="440" width="370" height="76" rx="10" fill="#fff" stroke="#dbe1ec"/><text x="550" y="470" text-anchor="middle" font-size="16" fill="#29364b">打开「审核结果详情」</text><text x="550" y="493" text-anchor="middle" font-size="12" fill="#7c8699">本轮结论、具体内容、版本、处理人、时间</text><path d="M550 516V548" fill="none" stroke="#9ba4b4" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="70" y="550" width="290" height="76" rx="10" fill="#fffbed" stroke="#e4bd28"/><text x="215" y="580" text-anchor="middle" font-size="16" fill="#29364b">草稿或本轮明确需补正</text><text x="215" y="603" text-anchor="middle" font-size="12" fill="#7c8699">可进入编辑；补正要求完整展示</text><rect x="390" y="550" width="320" height="76" rx="10" fill="#fff" stroke="#dbe1ec"/><text x="550" y="580" text-anchor="middle" font-size="16" fill="#29364b">审核中</text><text x="550" y="603" text-anchor="middle" font-size="12" fill="#7c8699">展示本轮进度，历史补正不解锁</text><rect x="740" y="550" width="290" height="76" rx="10" fill="#fff" stroke="#dbe1ec"/><text x="885" y="580" text-anchor="middle" font-size="16" fill="#29364b">通过 / 不通过 / 已录用</text><text x="885" y="603" text-anchor="middle" font-size="12" fill="#7c8699">只读内容，保留历次审核记录</text><path d="M550 530H215V550" fill="none" stroke="#9ba4b4" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M550 530V550" fill="none" stroke="#9ba4b4" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M550 530H885V550" fill="none" stroke="#9ba4b4" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="70" y="675" width="290" height="76" rx="10" fill="#fff" stroke="#dbe1ec"/><text x="215" y="705" text-anchor="middle" font-size="16" fill="#29364b">修改工作副本</text><text x="215" y="728" text-anchor="middle" font-size="12" fill="#7c8699">保存不增版本，原意见保留</text><path d="M215 626V675" fill="none" stroke="#9ba4b4" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="70" y="800" width="290" height="76" rx="10" fill="#fff" stroke="#dbe1ec"/><text x="215" y="830" text-anchor="middle" font-size="16" fill="#29364b">重新提交审核</text><text x="215" y="853" text-anchor="middle" font-size="12" fill="#7c8699">生成新版本快照，进入审核中</text><path d="M215 751V800" fill="none" stroke="#9ba4b4" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M360 838H550V626" fill="none" stroke="#9ba4b4" stroke-width="1.4" marker-end="url(#arrow)"/><text x="425" y="827" font-size="12" fill="#7b8596">重提后只读</text><text x="550" y="910" text-anchor="middle" font-size="12" fill="#8490a3">演示数据及审核为本地模拟；消息缺失显示明确占位，不编造补正内容。</text></g></svg>